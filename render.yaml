services:
  - type: web
    name: cognivora-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATA_DIR_PATH
        value: /data
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: cognivora-storage
      mountPath: /data
      sizeGB: 1
